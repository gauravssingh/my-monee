[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-monee"
version = "0.2.0"
description = "Local-first personal expense tracker for macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "keyring>=25.5.0",
  "python-dateutil>=2.9.0",
  "google-api-python-client>=2.154.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.1",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "google-genai>=2.3.0",
  "pypdf>=5.0.0",
  "pymupdf>=1.24.0",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
]

[project.scripts]
expense-tracker = "mymonee.__main__:main"
mymonee = "mymonee.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mymonee"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
