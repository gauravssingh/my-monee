# MyMonee — Defaults
# Override with ~/Library/Application Support/MyMonee/config.local.yaml or /config/config.local.yaml

app:
  name: my-monee
  host: 0.0.0.0
  port: 8477
  data_dir: null  # null → ~/Library/Application Support/MyMonee or /data
  # Public origin when served through a reverse proxy/tunnel, e.g.
  # https://my-monee.example.com. Used to build the OAuth callback URI for
  # browsers on other machines; must match an authorized redirect URI.
  public_url: null

database:
  filename: mymonee.db
  echo: false

logging:
  level: INFO
  # null → <data_dir>/logs/mymonee.log
  file: null

scheduler:
  enabled: false
  interval_minutes: 15

gmail:
  enabled: true
  # null → <data_dir>/gmail_credentials.json (OAuth Desktop client secrets)
  credentials_file: null
  scopes:
    - https://www.googleapis.com/auth/gmail.readonly
  # First sync / full backfill start date (Gmail after:YYYY/MM/DD)
  sync_after_date: "2026/01/01"
  # Used only if sync_after_date is null
  initial_lookback_days: 90
  max_messages_per_sync: 2000

privacy:
  allow_external_ai: false
  store_raw_email_bodies: false
  mask_identifiers: true

classification:
  auto_threshold: 0.85
  review_threshold: 0.55

dashboard:
  default_currency: INR
  month_start_day: 1

ai:
  enabled: true
  # All online AI calls go through OpenRouter. Use model IDs from
  # https://openrouter.ai/models — e.g. google/gemini-3.7-flash for chat
  # classification, or typesafe/jev-1.13 for Jev System One decisions.
  provider: openrouter
  # Jev = typed decisions via /systemone (fast, cheap, can't invent a category id).
  model: typesafe/jev-1.13
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 60.0
  max_attempts: 3
  backoff_seconds: 0.5
  # Chat fallback used only if Jev fails (2.0s / $0.0001 vs Gemini's 3.6s / $0.0035).
  disable_reasoning: true
  fallback_models:
    - deepseek/deepseek-v4.1-flash

# Local embedding-g2 service (loopback only) — semantic search over the ledger.
# Disabled by default; enable with embeddings.enabled=true in config.local.yaml.
embeddings:
  enabled: false
  base_url: http://127.0.0.1:8001
  timeout_seconds: 35.0
  batch_size: 50
  request_max_attempts: 5
  max_attempts: 5
  backoff_seconds: 0.5
  stale_job_seconds: 300
